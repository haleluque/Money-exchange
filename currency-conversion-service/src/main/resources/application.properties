spring.application.name=currency-conversion
server.port=8100
spring.config.import=optional:configserver:http://localhost:8888

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URI:http://localhost:8761/eureka}

#Zipkin - COMMENTED HERE AS IS DIRECTLY INJECTED FROM DOCKER COMPOSE FILE
#management.zipkin.tracing.endpoint=${SPRING_ZIPKIN_BASE_URL:http://zipkin-server:9411}

#Sampling configuration - gonna trace every request
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

currency-exchange-service.url=${CURRENCY_EXCHANGE_SERVICE_BASE_URL:http://localhost:8000}
